<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공부 타이머</title>
<meta name="theme-color" content="#0b7f86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e9eef1;--card:#fff;--ink:#11212b;--mute:#5d6f7b;--line:#d3dde3;--acc:#0b7f86;--warn:#c76a12;--bad:#b42f3a;--ok:#1d8a5b}
@media(prefers-color-scheme:dark){:root{--bg:#0e161b;--card:#16222a;--ink:#e8f0f4;--mute:#8fa3af;--line:#27363f;--acc:#4cc3c9;--warn:#f0a050;--bad:#ef6a74;--ok:#52c796}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1020px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:20px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#badge{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:600;background:var(--bg);border-left:5px solid var(--mute)}
#badge.run{border-color:var(--ok)}#badge.auto{border-color:var(--warn)}#badge.man{border-color:var(--acc)}#badge.stop{border-color:var(--bad)}
.clocks{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:end}
.lab{font-size:13px;color:var(--mute)}
.big{font-size:54px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--acc)}
.sm{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.btns{display:flex;gap:8px;margin:16px 0}
button{flex:1;padding:11px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#bStart{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){#bStart{color:#06201f}}
#bStop{color:var(--bad)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px}
li small{color:var(--mute);grid-column:1}
li .bar{grid-column:1/-1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
li .bar i{display:block;height:100%;width:0;background:var(--warn)}
li.on b{color:var(--warn)}
li.pen.on b{color:var(--ok)}
details{margin-top:14px;font-size:14px}
summary{cursor:pointer;color:var(--mute)}
.set{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-top:8px;align-items:center}
.set input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#sum{display:none;margin-top:12px;padding:12px;border-radius:8px;background:var(--bg)}
#sum b{font-variant-numeric:tabular-nums}
.big{font-size:clamp(54px,9vw,96px)}
#wlNote{margin-top:6px}
@media(pointer:coarse){button{min-height:56px;font-size:17px}}
@media(orientation:landscape) and (min-width:821px){
  main{padding:12px 16px;gap:12px;align-items:start}
  .cam{aspect-ratio:auto;height:calc(100dvh - 150px);min-height:260px}
  .cam video,.cam canvas{object-fit:contain}
  li{font-size:15px}
}
</style>
</head>
<body>
<main>
  <h1>공부 타이머 <span class="lab">카메라로 자세를 확인해 자동으로 기록해요. 영상은 이 브라우저 안에서만 처리됩니다.</span></h1>

  <section class="card">
    <div class="cam"><video id="vid" playsinline muted></video><canvas id="cv"></canvas></div>
    <div id="badge">시작 버튼을 눌러 주세요</div>
    <div class="lab" id="wlNote"></div>
  </section>

  <section class="card">
    <div class="clocks">
      <div><div class="lab">공부 시간</div><div class="big" id="tStudy">00:00:00</div></div>
      <div><div class="lab">앉아 있던 시간</div><div class="sm" id="tSit">00:00:00</div></div>
    </div>
    <div class="btns">
      <button id="bStart">공부 시작</button>
      <button id="bPause" disabled>일시정지</button>
      <button id="bStop" disabled>정지</button>
    </div>
    <div id="sum"></div>
    <ul id="conds"></ul>
    <details><summary>유예시간 설정 (초)</summary><div class="set" id="set"></div></details>
  </section>
</main>

<script type="module">
import {FilesetResolver,FaceLandmarker,PoseLandmarker,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=s=>document.querySelector(s);
const vid=$('#vid'),cv=$('#cv'),ctx=cv.getContext('2d');
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const hms=ms=>{const s=Math.floor(ms/1000);return [s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')};

// 공부 중이 아닌 상태 조건과 기본 유예시간(초)
const CFG=[
 {id:1,name:'자리 이탈',desc:'얼굴·상반신이 모두 안 보임',g:10},
 {id:2,name:'눈 감김',desc:'눈을 감은 상태가 이어짐',g:4},
 {id:3,name:'엎드림',desc:'얼굴이 가려지고 어깨가 내려감',g:5},
 {id:4,name:'고개 돌림',desc:'고개가 좌우로 크게 돌아감',g:10},
 {id:5,name:'움직임 없음',desc:'눈·손·상체 모두 거의 정지',g:120},
 {id:6,name:'손 위치',desc:'손이 가슴 위·얼굴 근처에 머묾',g:20},
 {id:8,name:'등받이에 기댐',desc:'상체를 뒤로 젖힘',g:15}];

const S={status:'idle',study:0,startT:0,endT:0,lastResume:0,since:{},prog:{},clearSince:null,
 base:null,cal:[],reason:'',lastMotion:0,prev:null,writing:false};
let ready=false,face,pose,hand;

// 조건 목록 · 설정 UI
$('#conds').innerHTML=CFG.map(c=>`<li id="c${c.id}"><span><b>${c.name}</b></span><span></span><small>${c.desc}</small><span></span><div class="bar"><i></i></div></li>`).join('')
 +`<li class="pen" id="cPen"><span><b>필기 자세</b></span><span></span><small>손 모양으로 필기를 추정해요. 감지되면 정지·손 위치 조건을 건너뛰어요.</small><span></span></li>`;
$('#set').innerHTML=CFG.map(c=>`<label for="g${c.id}">${c.name}</label><input id="g${c.id}" type="number" min="1" max="600" value="${c.g}">`).join('');
CFG.forEach(c=>$('#g'+c.id).addEventListener('input',e=>{c.g=Math.max(1,+e.target.value||c.g)}));

// 모델 · 카메라
async function boot(){
  badge('카메라와 모델을 준비하는 중…');
  const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
  vid.srcObject=st;await vid.play();cv.width=vid.videoWidth;cv.height=vid.videoHeight;
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const M="https://storage.googleapis.com/mediapipe-models/";
  const mk=async delegate=>{
    face=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+"face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});
    pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+"pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate},runningMode:"VIDEO",numPoses:1});
    hand=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M+"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate},runningMode:"VIDEO",numHands:2});
  };
  try{await mk("GPU")}catch(e){await mk("CPU")}
  ready=true;requestAnimationFrame(loop);
}

// 특징 추출
function extract(f,p,h){
  const o={face:false,sh:false,hands:[]};
  const fl=f.faceLandmarks[0];
  if(fl){
    o.face=true;o.nose=fl[1];
    const w=fl[454].x-fl[234].x;o.fw=Math.abs(w);o.yaw=(fl[1].x-fl[234].x)/(w||1);
    const bs={};(f.faceBlendshapes[0]?.categories||[]).forEach(c=>bs[c.categoryName]=c.score);
    const g=n=>bs[n]||0;
    o.eye=(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2-0.5*(g('eyeLookDownLeft')+g('eyeLookDownRight'))/2;
  }
  const pl=p.landmarks[0];
  if(pl){const a=pl[11],b=pl[12];
    if((a.visibility??1)>.5&&(b.visibility??1)>.5&&a.y<1&&b.y<1){o.sh=true;o.shY=(a.y+b.y)/2;o.shW=Math.abs(a.x-b.x);o.pts=[a,b];}}
  for(const hl of h.landmarks){
    const size=d(hl[0],hl[9])||1;
    o.hands.push({w:hl[0],c:{x:(hl[0].x+hl[9].x)/2,y:(hl[0].y+hl[9].y)/2},pinch:d(hl[4],hl[8])/size,lm:hl});
  }
  return o;
}

function draw(F){
  ctx.clearRect(0,0,cv.width,cv.height);
  const dot=(p,c,r=4)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x*cv.width,p.y*cv.height,r,0,7);ctx.fill()};
  if(F.nose)dot(F.nose,'#4cc3c9',6);
  (F.pts||[]).forEach(p=>dot(p,'#f0a050',6));
  F.hands.forEach(h=>h.lm.forEach(p=>dot(p,S.writing?'#52c796':'#fff',2.5)));
}

// 판정
function evaluate(F,now){
  if(S.status==='calibrating'){
    if(F.face&&F.sh)S.cal.push(F);
    badge(`보정 중 · 바른 자세로 앉아 주세요 (${Math.min(S.cal.length,25)}/25)`,'man');
    if(S.cal.length>=25){
      const m=k=>med(S.cal.map(x=>x[k]));
      S.base={shY:m('shY'),shW:m('shW'),fw:m('fw'),yaw:m('yaw'),eye:m('eye')};
      Object.assign(S,{status:'running',startT:now,lastResume:now,lastMotion:now,since:{},study:0});
    }
    return;
  }
  if(S.status!=='running'&&S.status!=='autoPaused')return;
  const B=S.base,chestY=(F.sh?F.shY:B.shY)+0.06;

  // 필기 자세: 손가락을 모아 쥔 모양 + 가슴 아래
  S.writing=F.hands.some(x=>x.pinch<.45&&x.w.y>chestY+.04);

  // 움직임(눈 깜빡임·손·상체)
  const P=S.prev;let moved=S.writing;
  if(P){
    if(F.face&&P.face&&(Math.abs(F.eye-P.eye)>.25||d(F.nose,P.nose)>.006))moved=true;
    if(F.sh&&P.sh&&Math.abs(F.shY-P.shY)>.006)moved=true;
    if(F.hands.length!==P.hands.length)moved=true;
    else F.hands.forEach((x,i)=>{if(d(x.w,P.hands[i].w)>.012)moved=true});
  }
  S.prev=F;if(moved)S.lastMotion=now;

  const raw={
    1:!F.face&&!F.sh,
    2:F.face&&F.eye>Math.max(.5,B.eye+.35),
    3:!F.face&&F.sh&&F.shY-B.shY>.10,
    4:F.face&&Math.abs(F.yaw-B.yaw)>.2,
    5:!S.writing&&now-S.lastMotion>3000,
    6:!S.writing&&F.hands.some(x=>x.c.y<chestY||(F.face&&d(x.c,F.nose)<F.fw*.9)),
    8:(F.sh&&F.shW<B.shW*.85)||(F.face&&F.fw<B.fw*.8)
  };
  const n=CFG.filter(c=>raw[c.id]).length;
  const mult=n>=2?.5:1; // 조건이 겹치면 유예시간 절반
  const conf=[];
  for(const c of CFG){
    const id=c.id;
    if(raw[id]){
      S.since[id]=id===5?S.lastMotion:(S.since[id]??now);
      const g=c.g*mult*(id===5&&!S.writing?.5:1)*1000; // 필기 자세 없음 + 정지면 더 짧게
      S.prog[id]=Math.min(1,(now-S.since[id])/g);
      if(now-S.since[id]>=g)conf.push(c);
    }else{S.since[id]=null;S.prog[id]=0}
  }
  if(S.status==='running'&&conf.length){
    const s=Math.min(...conf.map(c=>S.since[c.id]));
    S.study=Math.max(0,S.study-Math.min(now-s,now-S.lastResume)); // 시작 시점까지 소급 차감
    S.status='autoPaused';S.reason=conf.map(c=>c.name).join(', ');S.clearSince=null;
  }else if(S.status==='autoPaused'){
    if(CFG.some(c=>raw[c.id]))S.clearSince=null;
    else{
      S.clearSince??=now;
      if(now-S.clearSince>=3000){ // 3초 연속 정상이면 재개, 그 3초도 공부로 인정
        S.status='running';S.study+=3000;S.lastResume=now;S.since={};
      }
    }
  }
}

let lastDet=0;
function loop(){
  requestAnimationFrame(loop);
  if(!ready||vid.readyState<2)return;
  const t=performance.now();if(t-lastDet<110)return;lastDet=t;
  if(S.status==='idle'||S.status==='stopped'||S.status==='manualPaused'){ctx.clearRect(0,0,cv.width,cv.height);return}
  let F;
  try{F=extract(face.detectForVideo(vid,t),pose.detectForVideo(vid,t),hand.detectForVideo(vid,t))}catch(e){return}
  draw(F);evaluate(F,t);
}

// 화면 갱신
function badge(txt,cls=''){const b=$('#badge');b.textContent=txt;b.className=cls}
let lt=performance.now();
setInterval(()=>{
  const t=performance.now(),dt=t-lt;lt=t;
  if(S.status==='running')S.study+=dt;
  const sit=S.startT?((S.status==='stopped'?S.endT:t)-S.startT):0;
  $('#tStudy').textContent=hms(S.study);$('#tSit').textContent=hms(sit);
  if(S.status==='running')badge('공부 중','run');
  else if(S.status==='autoPaused')badge('자동 일시정지 · '+S.reason,'auto');
  else if(S.status==='manualPaused')badge('일시정지 중 (자리 비움)','man');
  else if(S.status==='stopped')badge('공부를 마쳤어요','stop');
  const live=S.status==='running'||S.status==='autoPaused';
  CFG.forEach(c=>{const li=$('#c'+c.id),p=live?(S.prog[c.id]||0):0;
    li.classList.toggle('on',p>0);li.querySelector('.bar i').style.width=p*100+'%';li.children[1].textContent=p>0?'감지 중':''});
  const pen=$('#cPen');pen.classList.toggle('on',live&&S.writing);pen.children[1].textContent=live&&S.writing?'감지됨':'';
},100);

// 화면 켜짐 유지 (공부 중 탭 화면이 꺼지지 않게)
let wl=null;
async function lock(){
  const n=$('#wlNote');
  if(!('wakeLock' in navigator)){n.textContent='이 브라우저는 화면 켜짐 유지를 지원하지 않아요. 화면 꺼짐 시간을 길게 설정해 주세요.';return}
  try{
    if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    n.textContent='화면 켜짐 유지 중';
  }catch(e){n.textContent='화면 켜짐 유지를 켜지 못했어요. 화면 꺼짐 시간을 길게 설정해 주세요.'}
}
function unlock(){try{wl&&wl.release()}catch(e){}wl=null;$('#wlNote').textContent=''}
document.addEventListener('visibilitychange',()=>{
  const active=['running','autoPaused','manualPaused','calibrating'].includes(S.status);
  if(document.hidden){
    // 화면이 꺼지거나 앱을 전환하면 감지가 멈추므로 자동 일시정지
    if(S.status==='running'){S.status='autoPaused';S.reason='화면 이탈(앱 전환·화면 꺼짐)';S.clearSince=null}
  }else if(active)lock();
});

// 버튼
const bS=$('#bStart'),bP=$('#bPause'),bX=$('#bStop');
function btn(){const run=['running','autoPaused','manualPaused','calibrating'].includes(S.status);
  bS.disabled=run;bP.disabled=!['running','autoPaused','manualPaused'].includes(S.status);bX.disabled=!run;
  bP.textContent=S.status==='manualPaused'?'다시 시작':'일시정지'}
bS.onclick=async()=>{
  bS.disabled=true;$('#sum').style.display='none';
  try{if(!ready)await boot()}catch(e){badge('카메라나 모델을 불러오지 못했어요. 카메라 권한과 인터넷 연결을 확인해 주세요.','stop');bS.disabled=false;console.error(e);return}
  Object.assign(S,{status:'calibrating',cal:[],study:0,startT:0,since:{},prog:{},prev:null,reason:''});btn();lock();
};
bP.onclick=()=>{
  const now=performance.now();
  if(S.status==='manualPaused'){Object.assign(S,{status:'running',lastResume:now,lastMotion:now,since:{},prev:null})}
  else{S.status='manualPaused'}
  btn();
};
bX.onclick=()=>{
  S.endT=performance.now();S.status='stopped';btn();unlock();
  const sit=S.endT-S.startT,r=sit>0?Math.round(S.study/sit*100):0;
  const el=$('#sum');el.style.display='block';
  el.innerHTML=`공부 <b>${hms(S.study)}</b> / 앉아 있던 시간 <b>${hms(sit)}</b><br>실제 공부 비율 <b>${r}%</b>`;
};
setInterval(btn,300);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
